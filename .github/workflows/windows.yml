name: Windows build

# The Windows app cannot be produced on macOS (WebView2, MSVC), so CI builds it.
# Every push compiles and tests it; a tag also uploads the installers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # The default token is read-only, so uploading to a release returns 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci

      - name: Fetch the Windows sidecars (MediaMTX, FFmpeg, ffprobe)
        run: pwsh scripts/fetch-windows-sidecars.ps1

      # Fails fast, before the long Rust build. The bundler runs the same
      # script again through beforeBundleCommand, which is a no-op rebuild.
      - name: Build the virtual camera filter
        run: pwsh scripts/build-windows-camera.ps1

      - name: Frontend checks
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the app
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Diagnose native startup failure
        if: failure()
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $test = Get-ChildItem src-tauri/target/debug/deps/dji_live_bridge_lib-*.exe | Select-Object -First 1
          if ($test -and $dumpbin) {
            $imports = & $dumpbin.FullName /imports $test.FullName
            $imports
            Get-ChildItem src-tauri/target/debug -Filter '*.dll' -Recurse | Select-Object FullName
            Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeImports {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibrary(string path);
            [DllImport("kernel32.dll", CharSet=CharSet.Ansi)] public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode)] public static extern uint GetModuleFileName(IntPtr module, StringBuilder name, int size);
          }
          '@
            $module = [IntPtr]::Zero
            foreach ($line in $imports) {
              if ($line -match 'delay load imports') { break }
              if ($line -match '^    ([\w.-]+\.dll)$') {
                $dll = $Matches[1]
                $module = [NativeImports]::LoadLibrary($dll)
                $path = [System.Text.StringBuilder]::new(1024)
                [void][NativeImports]::GetModuleFileName($module, $path, 1024)
                Write-Host "Resolved $dll to $path"
              } elseif ($module -ne [IntPtr]::Zero -and $line -match '^\s+[0-9A-F]+\s+([?\w@$]+)$') {
                $symbol = $Matches[1]
                if ([NativeImports]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) { Write-Host "MISSING ENTRY: $dll $symbol" }
              }
            }
            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'DXCore.dll', 'DirectML.dll', 'D3D12.dll', 'dxgi.dll')) {
              $path = Join-Path $env:SystemRoot "System32/$dll"
              if (Test-Path $path) {
                (Get-Item $path).VersionInfo | Select-Object FileName, FileVersion
                & $dumpbin.FullName /exports $path
              }
            }
          }

      - name: Collect installers
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Get-ChildItem -Recurse -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle `
            -Include *.exe | Copy-Item -Destination dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: dji-live-bridge-windows
          path: dist-windows/*
          if-no-files-found: error

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} (Get-ChildItem dist-windows/*).FullName --clobber
