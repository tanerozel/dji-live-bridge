<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0a5cf0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001a4d" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00245e" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px body with 100px margin -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  </g>

  <!-- broadcast waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="30" opacity=".9">
    <path d="M404 300 a150 150 0 0 1 216 0"/>
    <path d="M350 246 a228 228 0 0 1 324 0" opacity=".55"/>
  </g>

  <!-- quadcopter, top view -->
  <g filter="url(#soft)">
    <g stroke="#ffffff" stroke-width="34" stroke-linecap="round">
      <line x1="512" y1="590" x2="352" y2="450"/>
      <line x1="512" y1="590" x2="672" y2="450"/>
      <line x1="512" y1="590" x2="352" y2="730"/>
      <line x1="512" y1="590" x2="672" y2="730"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="22">
      <circle cx="352" cy="450" r="74"/>
      <circle cx="672" cy="450" r="74"/>
      <circle cx="352" cy="730" r="74"/>
      <circle cx="672" cy="730" r="74"/>
    </g>
    <g fill="#ffffff">
      <circle cx="352" cy="450" r="16"/>
      <circle cx="672" cy="450" r="16"/>
      <circle cx="352" cy="730" r="16"/>
      <circle cx="672" cy="730" r="16"/>
      <rect x="452" y="530" width="120" height="120" rx="34"/>
    </g>
    <circle cx="512" cy="590" r="24" fill="#0a5cf0"/>
  </g>

  <!-- live dot -->
  <circle cx="776" cy="248" r="62" fill="#ff3b30" stroke="#ffffff" stroke-width="18"/>
</svg>
