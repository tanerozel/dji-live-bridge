[package]
name = "dji-live-bridge"
version = "0.1.1"
description = "Local DJI RTMP to MediaMTX and OBS orchestration for macOS"
authors = ["DJI Live Bridge contributors"]
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "dji_live_bridge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
base64 = "=0.22.1"
dirs = "=6.0.0"
futures-util = "=0.3.31"
keyring = { version = "=3.6.3", features = ["apple-native"] }
nix = { version = "=0.30.1", features = ["fs", "signal"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-dialog = "=2.4.0"
thiserror = "=2.0.16"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.27.0"
tracing = "=0.1.41"
tracing-appender = "=0.2.3"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }
