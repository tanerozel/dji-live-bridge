# WirePlumber 0.5+ only. Install deliberately as described in README.md.
# This replaces the local Bluetooth role list during the lab experiment.
# hfp_hf is the local HF role; the connected remote device must be an AG.
monitor.bluez.properties = {
  bluez5.roles = [ hfp_hf ]
  bluez5.hfphsp-backend = "native"
  # Keep SCO in the software path; vendor ALSA SCO offload needs its own wiring.
  bluez5.hw-offload-sco = false
}
